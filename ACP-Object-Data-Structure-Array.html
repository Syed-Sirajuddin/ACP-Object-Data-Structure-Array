<!DOCTYPE html>
<html lang="en">
<head>
<title>Object and Array</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<h1>Object and Array</h1>

<p id="profile"></p>
<p id="pet"></p>
<p id="favcolor"></p>
<p id="before"></p>
<p id="after"></p>
<p id="random"></p>

<script>
var student = {
  name: "Riya",
  age: 11,
  grade: 7,
  hobby: "Drawing",
  favSport: "Cricket"
};
var colors = ["white", "black", "red", "green", "blue"];

document.getElementById("profile").innerHTML = "Name: " + student.name + " | Favourite sport: " + student["favSport"];
document.getElementById("pet").innerHTML = "Pet: " + student.pet;
document.getElementById("favcolor").innerHTML = "My favourite colour is " + colors[3];
document.getElementById("before").innerHTML = "Before pop: " + colors.join(" * ") + " (" + colors.length + " colours)";
colors.pop();
document.getElementById("after").innerHTML = "After pop: " + colors.join(" * ") + " (" + colors.length + " colours)";
document.getElementById("random").innerHTML = "Random colour: " + colors[Math.floor(Math.random() * colors.length)];
</script>

</body>
</html>
